name: Windows preview (dev)
on:
  push:
    branches-ignore: [main]
    paths: ["tools/win_preview.py", "gui/glass.py", ".github/workflows/win-preview.yml"]
  workflow_dispatch:
jobs:
  shot:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q PySide6 opencv-python-headless numpy Pillow
      - run: python tools/win_preview.py shots
      - shell: bash
        run: |
          cd shots && tar czf shots.tgz *.png && echo "===B64===" && base64 -w 4000 shots.tgz && echo && echo "===END==="
