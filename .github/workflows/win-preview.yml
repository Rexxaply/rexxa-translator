name: Windows preview (dev)
on:
  push:
    branches-ignore: [main]
    paths: ["tools/win_preview.py", ".github/workflows/win-preview.yml"]
  workflow_dispatch:
jobs:
  shot:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q PySide6 opencv-python-headless numpy Pillow requests deep-translator fonttools
      - shell: bash
        run: python -X faulthandler tools/win_preview.py; echo "EXIT=$?"
      - shell: bash
        run: |
          echo selesai
