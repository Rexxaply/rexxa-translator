name: UI preview (dev)
on:
  push:
    branches-ignore: [main]
    paths: ["gui/**", "tools/ui_preview.py"]
  workflow_dispatch:
jobs:
  shot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq libegl1 libgl1 libxkbcommon0 fonts-dejavu-core fonts-comic-neue fonts-liberation2 fonts-ubuntu fonts-firacode >/dev/null
          pip install -q PySide6 opencv-python-headless numpy Pillow requests deep-translator fonttools
      - run: QT_QPA_PLATFORM=offscreen python tools/ui_preview.py ui_preview
      - run: |
          cd ui_preview && tar czf shots.tgz *.png && echo "===B64===" && base64 -w 4000 shots.tgz && echo && echo "===END==="
      - uses: actions/upload-artifact@v4
        with:
          name: ui-preview
          path: ui_preview/*.png
